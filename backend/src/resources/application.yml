spring:
  application:
    name: dormitory-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/dormitory_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dormitory.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

jwt:
  secret: dormitory-secret-key-2024
  expiration: 86400000
